# ===========================================================
# EXTRAER PREFIJO DEL ORG VDC
# ===========================================================
- name: Extraer prefijo del Org VDC
  ansible.builtin.set_fact:
    locationPrefix: "{{ vcd.orgVdcName.split('-')[0] }}"
  delegate_to: localhost
  connection: local

- ===========================================================
# NETWORK POOL asociado al NSX Manager del Provider
# ===========================================================
- name: Obtener todos los Network Pools
  ansible.builtin.uri:
    url: "{{ vcd.host }}/cloudapi/1.0.0/networkPools/networkPoolSummaries"
    method: GET
    headers:
      Accept: "application/json;version={{ vcd.api_version }}"
      Authorization: "Bearer {{ vcd.access_token }}"
    return_content: yes
    validate_certs: false
  register: network_check
  delegate_to: localhost
  connection: local

- name: Buscar Network Pool por prefijo regional
  ansible.builtin.set_fact:
    network_match: >-
      {{
        (
          network_check.json['values']
          | selectattr('name', 'search', '^' ~ locationPrefix)
          | list
        )[0]
        if (
          network_check.json['values']
          | selectattr('name', 'search', '^' ~ locationPrefix)
          | list
        ) | length > 0 else {}
      }}
  when: network_check.json['values'] | length > 0
  delegate_to: localhost
  connection: local

- name: Validar Network Pool encontrado
  ansible.builtin.fail:
    msg: >-
      ❌ No se encontró ningún Network Pool asociado al NSX Manager
      '{{ provider_match.nsxTManager.name }}' con prefijo '{{ locationPrefix }}'.
  when: network_match == {}

# ===========================================================
# MOSTRAR VARIABLES DE ENTRADA ANTES DE PowerCLI
# ===========================================================
- name: Mostrar variables antes de ejecutar PowerCLI
  ansible.builtin.debug:
    msg:
      - "📡 Servidor VCD: {{ vcd.host }}"
      - "👤 Usuario: {{ vcd.user }}"
      - "🏗️  Org VDC: {{ vcd.orgVdcName }}"
      - "🏗️  EdgeName: {{ network_match.name }}"
      - "📝 Descripción: Organización {{ vcd.orgFullName }} - creado por AWX"
  delegate_to: localhost
  connection: local

# ===========================================================
# 🚀 CREAR EDGE GATEWAY VIA POWERSHELL (PowerCLI 13.3)
# ===========================================================
- name: Ejecutar script PowerCLI para crear Edge Gateway
  ansible.builtin.win_shell: |
    Write-Host "=== Iniciando creación de Edge Gateway (PowerCLI 13.3) ==="
    Write-Host "Servidor: {{ vcd.host }}"
    Write-Host "Usuario: {{ vcd.user }}"
    Write-Host "OrgVdc: {{ vcd.orgVdcName }}"
    Write-Host "EdgeName: {{ network_match.name }}"
    Write-Host "Script: C:\Users\jeferson.diaz\Documents\WindowsPowerShell\Scripts\edgegateway.ps1"

    powershell.exe -ExecutionPolicy Bypass -File "C:\Users\jeferson.diaz\Documents\WindowsPowerShell\Scripts\edgegateway.ps1" `
      -Server "{{ vcd.host }}" `
      -Username "{{ vcd.user }}" `
      -Password "{{ vcd.password }}" `
      -OrgVdcName "{{ vcd.orgVdcName }}" `
      -EdgeName "{{ network_match.name }}" `
      -$Type = "{{ vcd.networkType }}" `
      -ExternalNetworkName "{{ vcd.orgVdcName.split('-')[0] }}"
  register: edge_create_result
  delegate_to: win-builder

# ===========================================================
# 📋 Mostrar resultado del script PowerCLI
# ===========================================================
- name: Mostrar salida de creación del Edge
  ansible.builtin.debug:
    msg:
      - "📡 Edge Gateway ejecutado en PowerCLI remoto"
      - "{{ edge_create_result.stdout_lines }}"
